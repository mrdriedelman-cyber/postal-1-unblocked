<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal 1 (Unblocked)</title>
    <style>
        html, body, #jsdos { width: 100%; height: 100%; margin: 0; padding: 0; background-color: black; }
    </style>
    <!-- Loads the web-ready DOS emulator core libraries directly -->
    <link href="https://js-dos.com" rel="stylesheet">
    <script src="https://js-dos.com"></script>
</head>
<body>
    <div id="jsdos"></div>
    <script>
        // Points the emulator to a pre-packaged public DOS package of the game
        Dos(document.getElementById("jsdos"), {
            wdosboxUrl: "https://js-dos.com"
        }).ready((fs, main) => {
            fs.extract("https://jsdelivr.net").then(() => {
                main(["-c", "POSTAL.EXE"]);
            });
        });
    </script>
</body>
</html>
